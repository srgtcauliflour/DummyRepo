name: Build BLEInspector IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project BLEInspector.xcodeproj -scheme BLEInspector -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BLEInspector.app Payload/
          zip -r BLEInspector-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BLEInspector-unsigned-IPA
          path: BLEInspector-unsigned.ipa
